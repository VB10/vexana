name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  analyze:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          packages/vexana/lib packages/vexana/test
          packages/vexana_core/lib packages/vexana_core/test
          packages/vexana_jaspr/lib packages/vexana_jaspr/test

      - name: Install melos
        run: dart pub global activate melos

      - name: Analyze
        run: melos run analyze

      - name: Purity check (vexana_core)
        run: melos run purity

      - name: Compile guard (vexana_core JS)
        run: melos run compile-guard

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install melos
        run: dart pub global activate melos

      - name: Run tests
        run: melos run test

  package:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate vexana_core
        working-directory: packages/vexana_core
        run: dart pub publish --dry-run

      - name: Validate vexana
        working-directory: packages/vexana
        run: flutter pub publish --dry-run

      - name: Validate vexana_jaspr
        working-directory: packages/vexana_jaspr
        run: dart pub publish --dry-run

  example:
    name: Build examples and playground (web + wasm + jaspr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        working-directory: packages/vexana/example
        run: flutter build web --release

      - name: Build wasm
        working-directory: packages/vexana/example
        run: flutter build web --wasm --release

      - name: Build playground (wasm)
        working-directory: apps/playground
        run: flutter build web --wasm --release --base-href /vexana/

      - name: Install jaspr_cli
        run: dart pub global activate jaspr_cli

      - name: Build Jaspr example
        working-directory: packages/vexana_jaspr/example
        run: jaspr build
