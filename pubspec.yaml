name: vexana_workspace
description: vexana monorepo workspace root. Not published.
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - packages/vexana
  - packages/vexana/example
  - benchmark

dev_dependencies:
  melos: ^8.2.2

melos:
  scripts:
    analyze:
      run: dart analyze --fatal-infos --fatal-warnings
      description: Tüm paketleri analiz et

    # benchmark hariç: ölçümler dakikalar sürüyor, CI'ı gereksiz uzatır.
    test:
      run: melos exec --dir-exists=test --ignore="benchmark" -- flutter test
      description: Testi olan her pakette flutter test koş (benchmark hariç)

    coverage:
      run: >-
        melos exec --dir-exists=test --ignore="benchmark" --
        flutter test --coverage
      description: Coverage ile test koş

    benchmark:
      run: melos exec --scope="benchmark" -- flutter test --reporter expanded
      description: Performans ölçümlerini koş (benchmark/RESULTS.md'yi güncelle)
