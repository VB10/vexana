name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fork PRs get a read-only GITHUB_TOKEN regardless of what is declared here.
# The old github-script step that commented on the PR failed with
# "Resource not accessible by integration" for exactly that reason (#121).
# It was removed; the CI status is already visible on the PR.
permissions:
  contents: read

env:
  # Pinned so a Flutter release cannot turn CI red without a commit here.
  FLUTTER_VERSION: "3.44.8"

jobs:
  analyze:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # A single resolve at the workspace root covers every member.
      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          packages/vexana/lib packages/vexana/test

      - name: Install melos
        run: dart pub global activate melos

      - name: Analyze
        run: melos run analyze

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install melos
        run: dart pub global activate melos

      - name: Run tests
        run: melos run coverage

      - name: Check coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: packages/vexana/coverage/lcov.info
          # Measured at 77.5% on 2026-08-10. Raise this as coverage improves;
          # it is a ratchet, not a target.
          min_coverage: 75
          # The web halves of conditional imports cannot be reached from VM
          # tests, so counting them would cap the achievable total.
          exclude: >-
            **/cache/file/local_file_web.dart
            **/feature/ssl/html_custom_override.dart
            **/feature/logger/logger_web.dart
            **/feature/adapter/web_adapter.dart
            **/feature/path/html_path_provider.dart

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/vexana/coverage/lcov.info
          if-no-files-found: warn

  package:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The published package is no longer at the repo root.
      - name: Validate the package
        working-directory: packages/vexana
        run: flutter pub publish --dry-run

  example:
    name: Build example (web + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        working-directory: packages/vexana/example
        run: flutter build web --release

      # The real wasm guarantee. pana's platform score is downstream of this:
      # if the compiler does not pass, the score will not either.
      - name: Build wasm
        working-directory: packages/vexana/example
        run: flutter build web --wasm --release
